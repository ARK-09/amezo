spring:
  application:
    name: marketplace
  datasource:
    url: jdbc:postgresql://localhost:5432/marketplace
    username: postgres
    password: root
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks entities match it
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /v3/api-docs
  default-flat-param-object: true   # Pageable already binds page/size/sort as flat query
                                     # params at runtime; without this springdoc documents
                                     # it as one opaque nested object, which misrepresents
                                     # how the endpoint actually works, not just a style choice

app:
  cors:
    # frontend/'s `pnpm dev` proxies through portless, so the browser-visible
    # origin is the stable https name below, not localhost:5173 (that port is
    # still listed for `pnpm exec vite` / Playwright, which bypass the proxy)
    allowed-origins: http://localhost:5173,https://marketplace-frontend.localhost
  session:
    cookie-name: mp_session
    ttl-days: 30
  magic-link:
    ttl-minutes: 15
  s3:
    bucket: ${AWS_S3_BUCKET:marketplace-dev}
    region: ${AWS_REGION:us-east-1}

logging:
  level:
    org.hibernate.SQL: debug
