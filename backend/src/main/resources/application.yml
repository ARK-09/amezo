server:
  # Container hosts (Render, Cloud Run, Koyeb, Northflank) inject the port they
  # route to as $PORT and don't let you pick it - 8080 is only the local default.
  port: ${PORT:8080}

spring:
  application:
    name: amezo
  datasource:
    # Local default is the Postgres instance already running and migrated
    # locally - DB name intentionally "marketplace", not renamed to match the
    # project (see the identity commit's own note on this). Deployments
    # override it with JDBC_DATABASE_URL, which must be a *JDBC* URL, not the
    # postgres://user:pass@host/db URI most providers hand you:
    #   jdbc:postgresql://<host>/<db>?sslmode=require
    # with the user/password split out into the two vars below (Spring's
    # datasource URL parser doesn't read credentials out of the URI).
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/marketplace}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:root}
    hikari:
      # Free Postgres plans cap connections hard (Neon free: ~100 across all
      # clients, and its pooler counts per-endpoint), and one 512 MB JVM has no
      # use for Hikari's default 10 anyway.
      maximum-pool-size: ${DATABASE_POOL_SIZE:5}
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks entities match it
    open-in-view: false
    properties:
      hibernate:
        # Pretty-printing every statement is for reading logs by hand; a hosted
        # instance pays for the extra lines and reads nothing.
        format_sql: ${HIBERNATE_FORMAT_SQL:true}
  flyway:
    # Off only when migrations are being applied out-of-band (a shared database
    # someone else migrates, or a read replica). On by default, which is what
    # makes a fresh hosted database create its own schema on first boot.
    enabled: ${FLYWAY_ENABLED:true}
    # Not env: the migrations ship inside the jar, so this is a build-time fact
    # about the artifact, not an environment's choice.
    locations: classpath:db/migration

springdoc:
  api-docs:
    # The spec is public (SecurityConfig reads the path below to allow it), which
    # is fine for this project - it documents an API whose endpoints are already
    # public or cookie-guarded. Set false to stop serving it at all; note that
    # the deploy guide uses this path as the "did it boot" probe, so a disabled
    # spec means picking a different probe.
    enabled: ${API_DOCS_ENABLED:true}
    path: ${API_DOCS_PATH:/v3/api-docs}
  default-flat-param-object: true   # Pageable already binds page/size/sort as flat query
                                     # params at runtime; without this springdoc documents
                                     # it as one opaque nested object, which misrepresents
                                     # how the endpoint actually works, not just a style choice

app:
  # Base URL the magic-link email points at (SellerAuthService builds
  # /seller/verify?token=... on top of this) - the frontend dev server's own
  # origin, not the portless-proxied one, since this is what a real browser
  # opens from an email link. Deployed, this is the Vercel URL.
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  cors:
    # frontend/'s `pnpm dev` proxies through portless, so the browser-visible
    # origin is the stable https name below, not localhost:5173 (that port is
    # still listed for `pnpm exec vite` / Playwright, which bypass the proxy).
    # Deployed, this is the Vercel origin(s), comma-separated - and it has to
    # be exact: allowCredentials(true) means a wildcard is rejected outright.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,https://amezo-frontend.localhost}
  session:
    cookie-name: ${APP_SESSION_COOKIE_NAME:mp_session}
    ttl-days: ${APP_SESSION_TTL_DAYS:30}
    # Local dev is same-site over plain http, so Lax + no Secure flag. Hosted,
    # the frontend (Vercel) and API (anywhere else) are different registrable
    # domains, which makes every API call cross-site: the cookie is then only
    # sent back with SameSite=None, and browsers reject SameSite=None unless
    # Secure is also set. Hence both are config, not constants:
    # APP_SESSION_COOKIE_SAME_SITE=None + APP_SESSION_COOKIE_SECURE=true.
    cookie-same-site: ${APP_SESSION_COOKIE_SAME_SITE:Lax}
    cookie-secure: ${APP_SESSION_COOKIE_SECURE:false}
  magic-link:
    ttl-minutes: ${APP_MAGIC_LINK_TTL_MINUTES:15}
  s3:
    bucket: ${AWS_S3_BUCKET:amezo-dev}
    region: ${AWS_REGION:us-east-1}
    # Empty = real AWS S3. Set it to an S3-compatible provider's API endpoint
    # (R2: https://<account-id>.r2.cloudflarestorage.com, with region auto) and
    # config/S3Config.java switches the client and presigner over.
    endpoint: ${S3_ENDPOINT:}
    # Storage budget. The total is the one that costs money: object storage bills
    # per GB and the free tiers this deploys on (R2's 10 GB, B2's 10 GB) stop being
    # free past their allowance, so past the cap POST /products/{id}/images/upload-url
    # answers 507 instead of issuing more URLs. Counts stored objects plus
    # not-yet-expired presigned URLs, so a burst can't collectively overshoot.
    # 10 GiB total, 10 MiB per file.
    max-total-bytes: ${S3_MAX_TOTAL_BYTES:10737418240}
    max-upload-bytes: ${S3_MAX_UPLOAD_BYTES:10485760}
    # Where buyers' browsers load the images from, which on a non-AWS provider
    # is a different host than the API endpoint above (R2's pub-*.r2.dev
    # subdomain, or a custom domain in front of the bucket). Empty falls back to
    # the AWS virtual-hosted URL built from bucket + region.
    public-base-url: ${S3_PUBLIC_BASE_URL:}

logging:
  level:
    # Every statement at debug is a lot of log volume for a hosted instance
    # (and free tiers meter or truncate logs) - deployments set this to warn.
    org.hibernate.SQL: ${SQL_LOG_LEVEL:debug}
