spring:
  application:
    name: marketplace
  datasource:
    url: jdbc:postgresql://localhost:5432/marketplace
    username: marketplace
    password: marketplace
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks entities match it
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origins: http://localhost:5173
  session:
    cookie-name: mp_session
    ttl-days: 30
  magic-link:
    ttl-minutes: 15
  s3:
    bucket: ${AWS_S3_BUCKET:marketplace-dev}
    region: ${AWS_REGION:us-east-1}

logging:
  level:
    org.hibernate.SQL: debug
