# Render blueprint for the backend only - the frontend is on Vercel (see
# frontend/vercel.json) and stays there. Deploying this: Render dashboard ->
# New -> Blueprint -> pick this repo; then fill the four `sync: false` vars
# below in the dashboard (they hold the database URL/credentials and the real
# frontend origin, so they don't belong in a committed file).
#
# Free plan caveats, both covered in docs/deploy.md: the instance spins down
# after 15 minutes idle and takes ~1 minute to answer the request that wakes it,
# and Render's own free Postgres expires 30 days after creation - so the
# database lives on Neon (no expiry) and only the web service is Render's.
services:
  - type: web
    name: amezo-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: JDBC_DATABASE_URL       # jdbc:postgresql://<neon-host>/<db>?sslmode=require
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS  # exact Vercel origin(s), comma-separated, no trailing slash
        sync: false
      - key: APP_FRONTEND_URL          # same Vercel origin - magic-link emails point here
        sync: false
      # Cross-site by construction: the browser is on vercel.app, this API isn't.
      - key: APP_SESSION_COOKIE_SAME_SITE
        value: None
      - key: APP_SESSION_COOKIE_SECURE
        value: "true"
      - key: SQL_LOG_LEVEL
        value: warn
      # One 512 MB instance does not need 5 connections either, and Neon's free
      # compute is shared - keep the pool small enough to survive a cold start.
      - key: DATABASE_POOL_SIZE
        value: "3"
