openapi: 3.1.0
info:
  title: Amezo API (fixture)
  version: 0.0.0
  description: >
    Placeholder spec so the codegen pipeline (springdoc -> OpenAPI ->
    openapi-typescript) has something to run against before the Spring
    backend exposes its own. Modeled on docs/api-design.md's documented
    GET /products contract, not the backend's current partial
    implementation (q-only as of this writing — see ProductController.java).
    Swap `gen:api` in package.json to point at the live springdoc endpoint
    once the backend catches up to this contract; this file goes away then.
paths:
  /products:
    get:
      operationId: searchProducts
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
        - name: priceMin
          in: query
          schema: { type: number }
        - name: priceMax
          in: query
          schema: { type: number }
        - name: inStockOnly
          in: query
          schema: { type: boolean }
        - name: sort
          in: query
          schema:
            type: string
            enum: [relevance, price_asc, price_desc, newest]
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 16 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductSummaryPage'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /products/{productRef}:
    get:
      operationId: getProduct
      parameters:
        - name: productRef
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    delete:
      operationId: sellerDeleteProduct
      parameters:
        - name: productRef
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: No Content
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    patch:
      operationId: sellerUpdateProduct
      description: Partial update of a product's own fields - an omitted field is left as it is.
      parameters:
        - name: productRef
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerProductDetail'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /products/{productRef}/reviews:
    get:
      operationId: getProductReviews
      parameters:
        - name: productRef
          in: path
          required: true
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 10 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewPage'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  # Matches the real backend (orders/CheckoutService.java, orders/OrderController.java) -
  # variantId not offerId, expectedUnitPrice optional (used for price-drift detection
  # only when provided), sameAsShipping not billingSameAsShipping.
  /orders:
    post:
      operationId: checkout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /auth/seller/magic-link:
    post:
      operationId: sellerRequestMagicLink
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '204':
          description: No Content
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /auth/seller/verify:
    post:
      operationId: sellerVerify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerSession'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /auth/seller/session:
    delete:
      operationId: sellerSignOut
      responses:
        '204':
          description: No Content
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /categories:
    get:
      operationId: listCategories
      description: >
        The selectable system categories, in merchandising order. Retired ones are
        left out. No search parameter: the list is a dozen rows that change about
        never, so clients fetch it once and filter in memory rather than issuing a
        request per keystroke.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /countries:
    get:
      operationId: listCountries
      description: ISO 3166-1 alpha-2, ordered by name - the order a selector shows.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Country' }
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /reviews:
    post:
      operationId: createReview
      description: >
        Buyer session required, and the order line must be the caller's own purchase.
        Not nested under the product: the line names what was bought and the server
        derives the product from it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /products/{productRef}/reviews/eligibility:
    get:
      operationId: getReviewEligibility
      description: >
        Whether the signed-in buyer may review this product, and the purchase to
        submit against. Buyer-scoped, so it is its own request rather than a field on
        the public product response.
      parameters:
        - name: productRef
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewEligibility'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /auth/buyer/magic-link:
    post:
      operationId: buyerMagicLink
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
      responses:
        '204':
          description: No Content
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /auth/buyer/verify:
    post:
      operationId: buyerVerify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuyerSession'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /auth/buyer/session:
    delete:
      operationId: buyerSignOut
      responses:
        '204':
          description: No Content
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /checkout/last-details:
    get:
      operationId: getLastCheckoutDetails
      description: >
        The signed-in buyer's most recent delivery details, for prefilling checkout.
        204 means they have not ordered before, which is not an error - the form
        simply stays empty. Buyer-scoped even though POST /orders is public: placing
        an order needs no account, reading past ones does.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LastCheckoutDetails'
        '204':
          description: No previous order
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /sessions/current:
    delete:
      operationId: signOut
      description: >
        Signs out whoever the cookie names, buyer or seller alike. Role-agnostic on
        purpose: the account page is reachable by both, and the buyer-scoped
        DELETE /auth/buyer/session 403'd for a signed-in seller, which is why
        sign-out appeared to do nothing there.
      responses:
        '204':
          description: Signed out - session row deleted and cookie expired
        '401':
          description: No session to sign out of
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    get:
      operationId: getCurrentSession
      description: >
        Who the session cookie belongs to, buyer or seller. 401 (not 404, not an
        empty 200) is the documented answer for "nobody is signed in" - see
        SessionController on the backend and useSession on the frontend, which
        reads that 401 as data rather than as a failure.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionIdentity'
        '401':
          description: No session, or an expired/revoked one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /sellers/me/products:
    get:
      operationId: sellerListProducts
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerProductSummaryPage'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    post:
      operationId: sellerCreateProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: string, format: uuid }
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /products/{productId}/variants:
    post:
      operationId: sellerAddVariant
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVariantRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerVariant'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /images/{imageId}:
    delete:
      operationId: sellerDeleteImage
      description: Removes the image row and the object behind it.
      parameters:
        - name: imageId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Deleted
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /products/{productId}/images/upload-url:
    post:
      operationId: sellerCreateImageUploadUrl
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentType, position]
              properties:
                contentType: { type: string }
                fileSizeBytes: { type: integer }
                position: { type: integer }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [id, status, uploadUrl, expiresAt]
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string }
                  uploadUrl: { type: string }
                  expiresAt: { type: string, format: date-time }
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /products/{productId}/images/confirm:
    post:
      operationId: sellerConfirmImage
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [imageId]
              properties:
                imageId: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductImage'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /sellers/me/products/{productId}:
    get:
      operationId: sellerGetProduct
      description: The seller's own view of one product - exact stock, SKUs, and pending images included.
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerProductDetail'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /variants/{variantId}:
    delete:
      operationId: sellerDeleteVariant
      description: >-
        Refused with 409 when the variant has been ordered, or when it is the
        product's last one.
      parameters:
        - name: variantId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Deleted
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    patch:
      operationId: sellerUpdateVariant
      description: Partial update, flattened across variant (label, sku) and offer (price, stockQty).
      parameters:
        - name: variantId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVariantRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerVariant'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /sellers/me/orders:
    get:
      operationId: sellerListOrders
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [PLACED, SHIPPED, DELIVERED] }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerOrderSummaryPage'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /sellers/me/orders/{orderId}:
    get:
      operationId: sellerGetOrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerOrderDetail'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /sellers/me/orders/{orderId}/ship:
    post:
      operationId: sellerShipOrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trackingNumber]
              properties:
                trackingNumber: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerOrderDetail'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  # Proposed contract only - no backend implementation exists yet (added for the cart drawer's batch fetch).
  /variants:
    get:
      operationId: getVariantsByIds
      parameters:
        - name: ids
          in: query
          required: true
          schema: { type: string }
          description: Comma-separated variant ids. Ids that don't exist are simply omitted from the response.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/VariantOffer' }
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
components:
  schemas:
    Category:
      type: object
      required: [slug, name]
      properties:
        # The stable machine value. It travels in ?category= filters and in product
        # writes, and it does NOT change when the display name is edited.
        slug: { type: string }
        # What every screen prints. Shipped alongside the slug so no surface needs
        # the category list loaded just to turn one into the other.
        name: { type: string }
    Country:
      type: object
      required: [code, name]
      properties:
        code: { type: string, minLength: 2, maxLength: 2 }
        name: { type: string }
    Address:
      type: object
      required: [fullName, line1, city, state, postalCode, country]
      properties:
        fullName: { type: string }
        line1: { type: string }
        # The one optional field, matching CheckoutAddressRequest's validation
        # exactly - it is not marked required on the form either.
        line2: { type: string, nullable: true }
        city: { type: string }
        state: { type: string }
        postalCode: { type: string }
        # ISO 3166-1 alpha-2, the same code GET /countries serves and
        # @ValidCountryCode enforces - never a display name.
        country: { type: string, minLength: 2, maxLength: 2 }
    LastCheckoutDetails:
      type: object
      required: [phone, shippingAddress, billingSameAsShipping]
      properties:
        phone: { type: string }
        shippingAddress: { $ref: '#/components/schemas/Address' }
        billingSameAsShipping: { type: boolean }
        # Null when the last order billed to the shipping address. Echoing the
        # shipping one here would tick "same as shipping" off on a form where the
        # buyer never chose that.
        billingAddress:
          allOf: [{ $ref: '#/components/schemas/Address' }]
          nullable: true
    ProductSummary:
      type: object
      required: [id, slug, title, brandName, category, priceFrom, inStock, reviewCount, sellerId]
      properties:
        id: { type: string, format: uuid }
        # What the card links to, in place of the id.
        slug: { type: string }
        title: { type: string }
        brandName: { type: string }
        category: { $ref: '#/components/schemas/Category' }
        priceFrom: { type: number }
        thumbnailUrl: { type: string, nullable: true }
        avgRating: { type: number, nullable: true }
        # How many reviews that average is over. Zero is the unambiguous "nobody
        # has reviewed this" - avgRating being null cannot be told apart from a
        # field the client failed to read.
        reviewCount: { type: integer }
        inStock: { type: boolean }
        # What a card's Add-to-cart button puts in the cart, so it needs no
        # request of its own: the cheapest buyable offer, with its own price
        # (priceFrom can belong to a sold-out variant).
        defaultVariantId: { type: string, format: uuid, nullable: true }
        defaultVariantPrice: { type: number, nullable: true }
        # Lets the card refuse to add a seller's own product to their cart. The rule
        # is enforced in checkout; this is what stops the button lying about it.
        sellerId: { type: string, format: uuid }
    ProductSummaryPage:
      type: object
      required: [content, page, totalElements, totalPages]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/ProductSummary' }
        page: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }
    ProductImage:
      type: object
      required: [id, url, position]
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        position: { type: integer }
    ProductVariant:
      type: object
      required: [id, label, sku, price, stockQty]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        sku: { type: string }
        price: { type: number }
        stockQty: { type: integer }
    SellerSession:
      type: object
      required: [sellerId, email]
      properties:
        sellerId: { type: string, format: uuid }
        email: { type: string }
    SessionIdentity:
      type: object
      required: [identityType, identityId, email, expiresAt]
      properties:
        identityType: { type: string, enum: [BUYER, SELLER] }
        identityId: { type: string, format: uuid }
        email: { type: string }
        # Nullable in practice: a seller created by magic-link sign-in has only
        # supplied an email, and seller.full_name is nullable to match.
        fullName: { type: string, nullable: true }
        expiresAt: { type: string, format: date-time }
    SellerProductSummary:
      type: object
      required: [id, slug, title, category, variantCount, createdAt]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        thumbnailUrl: { type: string, nullable: true }
        category: { $ref: '#/components/schemas/Category' }
        variantCount: { type: integer }
        createdAt: { type: string, format: date-time }
    SellerVariant:
      type: object
      required: [id, label, sku, stockQty]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        sku: { type: string }
        price: { type: number, nullable: true }
        stockQty: { type: integer }
    SellerImage:
      type: object
      required: [id, url, position, status]
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        position: { type: integer }
        status: { type: string, enum: [PENDING, STORED] }
    SellerProductDetail:
      type: object
      required: [id, slug, title, category, variants, images]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        brandName: { type: string, nullable: true }
        description: { type: string, nullable: true }
        category: { $ref: '#/components/schemas/Category' }
        variants:
          type: array
          items: { $ref: '#/components/schemas/SellerVariant' }
        images:
          type: array
          items: { $ref: '#/components/schemas/SellerImage' }
    UpdateProductRequest:
      type: object
      description: >
        Every field optional - an omitted field is left as it is. Editing the title
        does NOT move the product's slug: links already handed out point at the old
        one.
      properties:
        title: { type: string }
        brandName: { type: string }
        description: { type: string }
        categorySlug: { type: string }
    UpdateVariantRequest:
      type: object
      description: Every field optional - an omitted field is left as it is.
      properties:
        label: { type: string }
        sku: { type: string }
        price: { type: number }
        stockQty: { type: integer }
    SellerProductSummaryPage:
      type: object
      required: [content, page, totalElements, totalPages]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/SellerProductSummary' }
        page: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }
    CreateVariantRequest:
      type: object
      required: [label, sku, price, stockQty]
      properties:
        label: { type: string }
        sku: { type: string }
        price: { type: number }
        stockQty: { type: integer }
    SellerOrderSummary:
      type: object
      required: [id, buyerEmail, placedAt, total, status]
      properties:
        id: { type: string, format: uuid }
        buyerEmail: { type: string }
        placedAt: { type: string, format: date-time }
        total: { type: number }
        status: { type: string, enum: [PLACED, SHIPPED, DELIVERED] }
    SellerOrderSummaryPage:
      type: object
      required: [content, page, totalElements, totalPages]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/SellerOrderSummary' }
        page: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }
    OrderLineDetail:
      type: object
      required: [id, productTitle, variantLabel, quantity, unitPrice]
      properties:
        id: { type: string, format: uuid }
        productTitle: { type: string }
        variantLabel: { type: string }
        quantity: { type: integer }
        unitPrice: { type: number }
        # Optional: the real backend's shared OrderLineResponse record (also
        # used by checkout's confirmation response) always includes this,
        # but the seller order-detail UI doesn't need it - total is shown
        # per-order, not per-line.
        lineTotal: { type: number }
    CheckoutAddress:
      type: object
      required: [fullName, line1, city, state, postalCode, country]
      properties:
        fullName: { type: string }
        line1: { type: string }
        line2: { type: string, nullable: true }
        city: { type: string }
        state: { type: string }
        postalCode: { type: string }
        # An ISO 3166-1 alpha-2 code from GET /countries. Validated on the server, so
        # a client that skips the selector cannot store "XX" or the plausible-but-
        # wrong "UK".
        country: { type: string, minLength: 2, maxLength: 2 }
    CheckoutLine:
      type: object
      required: [variantId, quantity]
      properties:
        variantId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1 }
        expectedUnitPrice: { type: number, nullable: true }
    CheckoutRequest:
      type: object
      required: [email, phone, shippingAddress, sameAsShipping, lines]
      properties:
        email: { type: string, format: email }
        phone: { type: string }
        shippingAddress: { $ref: '#/components/schemas/CheckoutAddress' }
        sameAsShipping: { type: boolean }
        billingAddress:
          allOf: [{ $ref: '#/components/schemas/CheckoutAddress' }]
          nullable: true
        lines:
          type: array
          items: { $ref: '#/components/schemas/CheckoutLine' }
    OrderLineResponse:
      type: object
      required: [id, productTitle, variantLabel, quantity, unitPrice, lineTotal]
      properties:
        id: { type: string, format: uuid }
        productTitle: { type: string }
        variantLabel: { type: string }
        quantity: { type: integer }
        unitPrice: { type: number }
        lineTotal: { type: number }
    OrderResponse:
      type: object
      required: [id, placedAt, lines, total]
      properties:
        id: { type: string, format: uuid }
        placedAt: { type: string, format: date-time }
        lines:
          type: array
          items: { $ref: '#/components/schemas/OrderLineResponse' }
        total: { type: number }
    SellerOrderDetail:
      type: object
      required: [id, buyerEmail, placedAt, total, status, lines]
      properties:
        id: { type: string, format: uuid }
        buyerEmail: { type: string }
        placedAt: { type: string, format: date-time }
        total: { type: number }
        status: { type: string, enum: [PLACED, SHIPPED, DELIVERED] }
        trackingNumber: { type: string, nullable: true }
        shippedAt: { type: string, format: date-time, nullable: true }
        lines:
          type: array
          items: { $ref: '#/components/schemas/OrderLineDetail' }
    CreateProductRequest:
      type: object
      required: [title, categorySlug, variants]
      properties:
        title: { type: string }
        brandName: { type: string, nullable: true }
        description: { type: string, nullable: true }
        # A slug from GET /categories. The server refuses anything that isn't a live
        # system category, so a client cannot invent one by posting a name.
        categorySlug: { type: string }
        variants:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/CreateVariantRequest' }
    VariantOffer:
      type: object
      required: [id, productId, productSlug, productTitle, variantLabel, price, stockQty, sellerId]
      properties:
        id: { type: string }
        productId: { type: string, format: uuid }
        # What the drawer links back to.
        productSlug: { type: string }
        productTitle: { type: string }
        variantLabel: { type: string }
        thumbnailUrl: { type: string, nullable: true }
        price: { type: number }
        stockQty: { type: integer }
        # Lets the cart mark a line its viewer cannot buy because they are its
        # seller, instead of staying silent until the order is refused.
        sellerId: { type: string, format: uuid }
    ReviewSummary:
      type: object
      required: [averageRating, count]
      properties:
        averageRating: { type: number, nullable: true }
        count: { type: integer }
    ProductDetail:
      type: object
      required:
        [id, slug, sellerId, title, brandName, description, category, images, variants, reviewSummary]
      properties:
        id: { type: string, format: uuid }
        # The page is addressed by slug; the id is still what the cart, the reviews
        # and the images are keyed by internally.
        slug: { type: string }
        # For the own-product check on the buy box. sellerName is gone: it was in this
        # contract but never returned by the API, and nothing renders it - a field
        # that only exists in the spec is worse than an absent one.
        sellerId: { type: string, format: uuid }
        title: { type: string }
        brandName: { type: string, nullable: true }
        description: { type: string, nullable: true }
        category: { $ref: '#/components/schemas/Category' }
        images:
          type: array
          items: { $ref: '#/components/schemas/ProductImage' }
        variants:
          type: array
          items: { $ref: '#/components/schemas/ProductVariant' }
        reviewSummary:
          $ref: '#/components/schemas/ReviewSummary'
    Review:
      type: object
      required: [id, rating, createdAt]
      properties:
        id: { type: string, format: uuid }
        rating: { type: integer, minimum: 1, maximum: 5 }
        # A star rating on its own is a legitimate review.
        body: { type: string, nullable: true }
        variantLabel: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        # The buyer's own name. Null when their identity has only ever supplied an
        # email, which the UI shows as an anonymous reviewer rather than a blank.
        reviewerName: { type: string, nullable: true }
    CreateReviewRequest:
      type: object
      required: [orderLineId, rating]
      properties:
        # The purchase being reviewed. The server derives the product from it, so a
        # valid line cannot be used to review something else.
        orderLineId: { type: string, format: uuid }
        rating: { type: integer, minimum: 1, maximum: 5 }
        body: { type: string, nullable: true }
    ReviewEligibility:
      type: object
      required: [eligible]
      properties:
        eligible: { type: boolean }
        reason:
          type: string
          nullable: true
          enum: [NOT_PURCHASED, ALREADY_REVIEWED]
        # The purchase to submit against - present exactly when eligible is true.
        orderLineId: { type: string, format: uuid, nullable: true }
        existingReview:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/Review' }]
    BuyerSession:
      type: object
      required: [buyerIdentityId, email]
      properties:
        buyerIdentityId: { type: string, format: uuid }
        email: { type: string }
        fullName: { type: string, nullable: true }
    ReviewPage:
      type: object
      required: [content, page, totalElements, totalPages]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/Review' }
        page: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }
    ProblemDetail:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              reason: { type: string }
