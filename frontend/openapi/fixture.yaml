openapi: 3.1.0
info:
  title: Amezo API (fixture)
  version: 0.0.0
  description: >
    Placeholder spec so the codegen pipeline (springdoc -> OpenAPI ->
    openapi-typescript) has something to run against before the Spring
    backend exposes its own. Modeled on docs/api-design.md's documented
    GET /products contract, not the backend's current partial
    implementation (q-only as of this writing — see ProductController.java).
    Swap `gen:api` in package.json to point at the live springdoc endpoint
    once the backend catches up to this contract; this file goes away then.
paths:
  /products:
    get:
      operationId: searchProducts
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
        - name: priceMin
          in: query
          schema: { type: number }
        - name: priceMax
          in: query
          schema: { type: number }
        - name: inStockOnly
          in: query
          schema: { type: boolean }
        - name: sort
          in: query
          schema:
            type: string
            enum: [relevance, price_asc, price_desc, newest]
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 16 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductSummaryPage'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /products/{productRef}:
    get:
      operationId: getProduct
      parameters:
        - name: productRef
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    delete:
      operationId: sellerDeleteProduct
      parameters:
        - name: productRef
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: No Content
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    patch:
      operationId: sellerUpdateProduct
      description: Partial update of a product's own fields - an omitted field is left as it is.
      parameters:
        - name: productRef
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerProductDetail'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /products/{productRef}/reviews:
    get:
      operationId: getProductReviews
      parameters:
        - name: productRef
          in: path
          required: true
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 10 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewPage'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  # Matches the real backend (orders/CheckoutService.java, orders/OrderController.java) -
  # variantId not offerId, expectedUnitPrice optional (used for price-drift detection
  # only when provided), sameAsShipping not billingSameAsShipping.
  /orders:
    post:
      operationId: checkout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /auth/seller/magic-link:
    post:
      operationId: sellerRequestMagicLink
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '204':
          description: No Content
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /auth/seller/verify:
    post:
      operationId: sellerVerify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerSession'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /auth/seller/session:
    delete:
      operationId: sellerSignOut
      responses:
        '204':
          description: No Content
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /categories:
    get:
      operationId: listCategories
      description: >
        The selectable system categories, in merchandising order. Retired ones are
        left out. No search parameter: the list is a dozen rows that change about
        never, so clients fetch it once and filter in memory rather than issuing a
        request per keystroke.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /countries:
    get:
      operationId: listCountries
      description: ISO 3166-1 alpha-2, ordered by name - the order a selector shows.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Country' }
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /reviews:
    post:
      operationId: createReview
      description: >
        Buyer session required, and the order line must be the caller's own purchase.
        Not nested under the product: the line names what was bought and the server
        derives the product from it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /products/{productRef}/reviews/eligibility:
    get:
      operationId: getReviewEligibility
      description: >
        Whether the signed-in buyer may review this product, and the purchase to
        submit against. Buyer-scoped, so it is its own request rather than a field on
        the public product response.
      parameters:
        - name: productRef
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewEligibility'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /auth/buyer/magic-link:
    post:
      operationId: buyerMagicLink
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
      responses:
        '204':
          description: No Content
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /auth/buyer/verify:
    post:
      operationId: buyerVerify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuyerSession'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /auth/buyer/session:
    delete:
      operationId: buyerSignOut
      responses:
        '204':
          description: No Content
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /checkout/last-details:
    get:
      operationId: getLastCheckoutDetails
      description: >
        The signed-in buyer's most recent delivery details, for prefilling checkout.
        204 means they have not ordered before, which is not an error - the form
        simply stays empty. Buyer-scoped even though POST /orders is public: placing
        an order needs no account, reading past ones does.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LastCheckoutDetails'
        '204':
          description: No previous order
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /sessions/current:
    delete:
      operationId: signOut
      description: >
        Signs out whoever the cookie names, buyer or seller alike. Role-agnostic on
        purpose: the account page is reachable by both, and the buyer-scoped
        DELETE /auth/buyer/session 403'd for a signed-in seller, which is why
        sign-out appeared to do nothing there.
      responses:
        '204':
          description: Signed out - session row deleted and cookie expired
        '401':
          description: No session to sign out of
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    get:
      operationId: getCurrentSession
      description: >
        Who the session cookie belongs to, buyer or seller. 401 (not 404, not an
        empty 200) is the documented answer for "nobody is signed in" - see
        SessionController on the backend and useSession on the frontend, which
        reads that 401 as data rather than as a failure.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionIdentity'
        '401':
          description: No session, or an expired/revoked one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /sellers/me/products:
    get:
      operationId: sellerListProducts
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerProductSummaryPage'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    post:
      operationId: sellerCreateProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: string, format: uuid }
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /products/{productId}/variants:
    post:
      operationId: sellerAddVariant
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVariantRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerVariant'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /images/{imageId}:
    delete:
      operationId: sellerDeleteImage
      description: Removes the image row and the object behind it.
      parameters:
        - name: imageId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Deleted
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /products/{productId}/images/upload-url:
    post:
      operationId: sellerCreateImageUploadUrl
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentType, position]
              properties:
                contentType: { type: string }
                fileSizeBytes: { type: integer }
                position: { type: integer }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [id, status, uploadUrl, expiresAt]
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string }
                  uploadUrl: { type: string }
                  expiresAt: { type: string, format: date-time }
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /products/{productId}/images/confirm:
    post:
      operationId: sellerConfirmImage
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [imageId]
              properties:
                imageId: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductImage'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /sellers/me/products/{productId}:
    get:
      operationId: sellerGetProduct
      description: The seller's own view of one product - exact stock, SKUs, and pending images included.
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerProductDetail'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /variants/{variantId}:
    delete:
      operationId: sellerDeleteVariant
      description: >-
        Refused with 409 when the variant has been ordered, or when it is the
        product's last one.
      parameters:
        - name: variantId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Deleted
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    patch:
      operationId: sellerUpdateVariant
      description: Partial update, flattened across variant (label, sku) and offer (price, stockQty).
      parameters:
        - name: variantId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVariantRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerVariant'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /sellers/me/orders:
    get:
      operationId: sellerListOrders
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/OrderStatus' }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerOrderSummaryPage'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /sellers/me/orders/{orderId}:
    get:
      operationId: sellerGetOrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerOrderDetail'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /sellers/me/orders/{orderId}/ship:
    post:
      operationId: sellerShipOrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trackingNumber]
              properties:
                trackingNumber: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerOrderDetail'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  # Proposed contract only - no backend implementation exists yet (added for the cart drawer's batch fetch).
  /variants:
    get:
      operationId: getVariantsByIds
      parameters:
        - name: ids
          in: query
          required: true
          schema: { type: string }
          description: Comma-separated variant ids. Ids that don't exist are simply omitted from the response.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/VariantOffer' }
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  # ---------------------------------------------------------------------------
  # /api/v1 — everything designed in this round. Existing unversioned paths above
  # stay where they are until the backend serves them under the prefix too (see
  # docs/backend-handoff.md); nothing new is added without a version.
  # ---------------------------------------------------------------------------

  /api/v1/orders:
    get:
      operationId: listBuyerOrders
      description: >-
        The signed-in buyer's own orders, newest first. One entry per seller
        order, so a checkout that split across two sellers shows two rows.
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/OrderStatus' }
        - name: group
          in: query
          description: Coarse filter the My Orders tabs use, applied on top of status.
          schema: { type: string, enum: [all, in_progress, delivered, refunds] }
        - name: q
          in: query
          description: Matches order reference and product titles.
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 10 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuyerOrderSummaryPage'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/orders/{orderId}:
    get:
      operationId: getBuyerOrder
      description: 404 (not 403) when the order exists but is not the caller's.
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuyerOrderDetail'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v1/refund-requests:
    get:
      operationId: listBuyerRefundRequests
      description: The signed-in buyer's own refund requests.
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/RefundStatus' }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 10 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundRequestPage'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    post:
      operationId: createRefundRequest
      description: >-
        Buyer session required, and every line must belong to the caller's own
        order. 409 when a line already has an open request, 422 when the return
        window has closed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRefundRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundRequestDetail'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/refund-requests/{refundRequestId}:
    get:
      operationId: getRefundRequest
      description: Readable by the buyer who raised it and by the seller who owes it.
      parameters:
        - name: refundRequestId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundRequestDetail'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    patch:
      operationId: updateRefundRequest
      description: >-
        The state machine lives on the resource rather than on action URLs.
        Seller moves REQUESTED to APPROVED/AWAITING_RETURN/DECLINED, then to
        RETURN_RECEIVED, REFUNDED or REPLACEMENT_SENT. Buyer may only CANCEL,
        and only while REQUESTED. An illegal transition is 409.
      parameters:
        - name: refundRequestId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRefundRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundRequestDetail'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/sellers/me/refund-requests:
    get:
      operationId: sellerListRefundRequests
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/RefundStatus' }
        - name: q
          in: query
          description: Matches buyer name, buyer email, order reference and product title.
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundRequestPage'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v1/sellers/me/store:
    get:
      operationId: getMyStore
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreProfile'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    patch:
      operationId: updateMyStore
      description: >-
        Partial update; an omitted field is left as it is. 409 when the handle
        is already taken, so the seller learns which field collided.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStoreProfile'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreProfile'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/stores/{handle}:
    get:
      operationId: getPublicStore
      description: Public storefront header. Replaces deriving a store from brandName.
      parameters:
        - name: handle
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicStore'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v1/sellers/me/metrics:
    get:
      operationId: getSellerMetrics
      description: >-
        Totals plus a daily series for the window, and the same totals for the
        immediately preceding window of equal length so the UI can show deltas
        without a second call.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
        - name: interval
          in: query
          schema: { type: string, enum: [day, week, month], default: day }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerMetrics'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/sellers/me/metrics/top-products:
    get:
      operationId: getSellerTopProducts
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
        - name: limit
          in: query
          schema: { type: integer, default: 5 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TopProduct' }
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/sellers/me/metrics/category-breakdown:
    get:
      operationId: getSellerCategoryBreakdown
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CategoryShare' }
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/sellers/me/products:
    get:
      operationId: sellerListProductsV1
      description: >-
        The seller's catalog with the filtering the products screen needs.
        Supersedes the unversioned GET /sellers/me/products, which takes no
        parameters and is capped at one page of 100.
      parameters:
        - name: q
          in: query
          description: Matches title, brand and SKU.
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ProductStatus' }
        - name: categorySlug
          in: query
          schema: { type: string }
        - name: stockBelow
          in: query
          description: Only products whose total stock is under this, for the low-stock widget.
          schema: { type: integer }
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, oldest, title_asc, title_desc, stock_asc, price_asc, price_desc]
            default: newest
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerProductRowPage'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/sellers/me/orders:
    get:
      operationId: sellerListOrdersV1
      parameters:
        - name: q
          in: query
          description: Matches order reference, recipient name and buyer email.
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/OrderStatus' }
        - name: sort
          in: query
          schema: { type: string, enum: [newest, oldest, total_desc, total_asc], default: newest }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerOrderRowPage'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/sellers/me/orders/{orderId}:
    get:
      operationId: sellerGetOrderV1
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerOrderRowDetail'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    patch:
      operationId: sellerUpdateOrder
      description: >-
        Advances the order. Replaces POST /sellers/me/orders/{orderId}/ship,
        which put the verb in the path. PLACED to PACKED takes parcels;
        PACKED/PLACED to SHIPPED takes a tracking number. Any other transition
        is 409.
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSellerOrder'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerOrderRowDetail'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

components:
  schemas:
    Category:
      type: object
      required: [slug, name]
      properties:
        # The stable machine value. It travels in ?category= filters and in product
        # writes, and it does NOT change when the display name is edited.
        slug: { type: string }
        # What every screen prints. Shipped alongside the slug so no surface needs
        # the category list loaded just to turn one into the other.
        name: { type: string }
    Country:
      type: object
      required: [code, name]
      properties:
        code: { type: string, minLength: 2, maxLength: 2 }
        name: { type: string }
    Address:
      type: object
      required: [fullName, line1, city, state, postalCode, country]
      properties:
        fullName: { type: string }
        line1: { type: string }
        # The one optional field, matching CheckoutAddressRequest's validation
        # exactly - it is not marked required on the form either.
        line2: { type: string, nullable: true }
        city: { type: string }
        state: { type: string }
        postalCode: { type: string }
        # ISO 3166-1 alpha-2, the same code GET /countries serves and
        # @ValidCountryCode enforces - never a display name.
        country: { type: string, minLength: 2, maxLength: 2 }
    LastCheckoutDetails:
      type: object
      required: [phone, shippingAddress, billingSameAsShipping]
      properties:
        phone: { type: string }
        shippingAddress: { $ref: '#/components/schemas/Address' }
        billingSameAsShipping: { type: boolean }
        # Null when the last order billed to the shipping address. Echoing the
        # shipping one here would tick "same as shipping" off on a form where the
        # buyer never chose that.
        billingAddress:
          allOf: [{ $ref: '#/components/schemas/Address' }]
          nullable: true
    ProductSummary:
      type: object
      required: [id, slug, title, brandName, category, priceFrom, inStock, reviewCount, sellerId]
      properties:
        id: { type: string, format: uuid }
        # What the card links to, in place of the id.
        slug: { type: string }
        title: { type: string }
        brandName: { type: string }
        category: { $ref: '#/components/schemas/Category' }
        priceFrom: { type: number }
        thumbnailUrl: { type: string, nullable: true }
        avgRating: { type: number, nullable: true }
        # How many reviews that average is over. Zero is the unambiguous "nobody
        # has reviewed this" - avgRating being null cannot be told apart from a
        # field the client failed to read.
        reviewCount: { type: integer }
        inStock: { type: boolean }
        # What a card's Add-to-cart button puts in the cart, so it needs no
        # request of its own: the cheapest buyable offer, with its own price
        # (priceFrom can belong to a sold-out variant).
        defaultVariantId: { type: string, format: uuid, nullable: true }
        defaultVariantPrice: { type: number, nullable: true }
        # Lets the card refuse to add a seller's own product to their cart. The rule
        # is enforced in checkout; this is what stops the button lying about it.
        sellerId: { type: string, format: uuid }
    ProductSummaryPage:
      type: object
      required: [content, page, totalElements, totalPages]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/ProductSummary' }
        page: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }
    ProductImage:
      type: object
      required: [id, url, position]
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        position: { type: integer }
    ProductVariant:
      type: object
      required: [id, label, sku, price, stockQty]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        sku: { type: string }
        price: { type: number }
        stockQty: { type: integer }
    SellerSession:
      type: object
      required: [sellerId, email]
      properties:
        sellerId: { type: string, format: uuid }
        email: { type: string }
    SessionIdentity:
      type: object
      required: [identityType, identityId, email, expiresAt]
      properties:
        identityType: { type: string, enum: [BUYER, SELLER] }
        identityId: { type: string, format: uuid }
        email: { type: string }
        # Nullable in practice: a seller created by magic-link sign-in has only
        # supplied an email, and seller.full_name is nullable to match.
        fullName: { type: string, nullable: true }
        expiresAt: { type: string, format: date-time }
    SellerProductSummary:
      type: object
      required: [id, slug, title, category, variantCount, createdAt]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        thumbnailUrl: { type: string, nullable: true }
        category: { $ref: '#/components/schemas/Category' }
        variantCount: { type: integer }
        createdAt: { type: string, format: date-time }
    SellerVariant:
      type: object
      required: [id, label, sku, stockQty]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        sku: { type: string }
        price: { type: number, nullable: true }
        stockQty: { type: integer }
    SellerImage:
      type: object
      required: [id, url, position, status]
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        position: { type: integer }
        status: { type: string, enum: [PENDING, STORED] }
    SellerProductDetail:
      type: object
      required: [id, slug, title, category, variants, images]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        brandName: { type: string, nullable: true }
        description: { type: string, nullable: true }
        category: { $ref: '#/components/schemas/Category' }
        variants:
          type: array
          items: { $ref: '#/components/schemas/SellerVariant' }
        images:
          type: array
          items: { $ref: '#/components/schemas/SellerImage' }
    UpdateProductRequest:
      type: object
      description: >
        Every field optional - an omitted field is left as it is. Editing the title
        does NOT move the product's slug: links already handed out point at the old
        one.
      properties:
        title: { type: string }
        brandName: { type: string }
        description: { type: string }
        categorySlug: { type: string }
    UpdateVariantRequest:
      type: object
      description: Every field optional - an omitted field is left as it is.
      properties:
        label: { type: string }
        sku: { type: string }
        price: { type: number }
        stockQty: { type: integer }
    SellerProductSummaryPage:
      type: object
      required: [content, page, totalElements, totalPages]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/SellerProductSummary' }
        page: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }
    CreateVariantRequest:
      type: object
      required: [label, sku, price, stockQty]
      properties:
        label: { type: string }
        sku: { type: string }
        price: { type: number }
        stockQty: { type: integer }
    SellerOrderSummary:
      type: object
      required: [id, buyerEmail, placedAt, total, status]
      properties:
        id: { type: string, format: uuid }
        buyerEmail: { type: string }
        placedAt: { type: string, format: date-time }
        total: { type: number }
        status: { $ref: '#/components/schemas/OrderStatus' }
    SellerOrderSummaryPage:
      type: object
      required: [content, page, totalElements, totalPages]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/SellerOrderSummary' }
        page: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }
    OrderLineDetail:
      type: object
      required: [id, productTitle, variantLabel, quantity, unitPrice]
      properties:
        id: { type: string, format: uuid }
        productTitle: { type: string }
        variantLabel: { type: string }
        quantity: { type: integer }
        unitPrice: { type: number }
        # Optional: the real backend's shared OrderLineResponse record (also
        # used by checkout's confirmation response) always includes this,
        # but the seller order-detail UI doesn't need it - total is shown
        # per-order, not per-line.
        lineTotal: { type: number }
    CheckoutAddress:
      type: object
      required: [fullName, line1, city, state, postalCode, country]
      properties:
        fullName: { type: string }
        line1: { type: string }
        line2: { type: string, nullable: true }
        city: { type: string }
        state: { type: string }
        postalCode: { type: string }
        # An ISO 3166-1 alpha-2 code from GET /countries. Validated on the server, so
        # a client that skips the selector cannot store "XX" or the plausible-but-
        # wrong "UK".
        country: { type: string, minLength: 2, maxLength: 2 }
    CheckoutLine:
      type: object
      required: [variantId, quantity]
      properties:
        variantId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1 }
        expectedUnitPrice: { type: number, nullable: true }
    CheckoutRequest:
      type: object
      required: [email, phone, shippingAddress, sameAsShipping, lines]
      properties:
        email: { type: string, format: email }
        phone: { type: string }
        shippingAddress: { $ref: '#/components/schemas/CheckoutAddress' }
        sameAsShipping: { type: boolean }
        billingAddress:
          allOf: [{ $ref: '#/components/schemas/CheckoutAddress' }]
          nullable: true
        lines:
          type: array
          items: { $ref: '#/components/schemas/CheckoutLine' }
    OrderLineResponse:
      type: object
      required: [id, productTitle, variantLabel, quantity, unitPrice, lineTotal]
      properties:
        id: { type: string, format: uuid }
        productTitle: { type: string }
        variantLabel: { type: string }
        quantity: { type: integer }
        unitPrice: { type: number }
        lineTotal: { type: number }
    OrderResponse:
      type: object
      required: [id, placedAt, lines, total]
      properties:
        id: { type: string, format: uuid }
        placedAt: { type: string, format: date-time }
        lines:
          type: array
          items: { $ref: '#/components/schemas/OrderLineResponse' }
        total: { type: number }
    SellerOrderDetail:
      type: object
      required: [id, buyerEmail, placedAt, total, status, lines]
      properties:
        id: { type: string, format: uuid }
        buyerEmail: { type: string }
        placedAt: { type: string, format: date-time }
        total: { type: number }
        status: { $ref: '#/components/schemas/OrderStatus' }
        trackingNumber: { type: string, nullable: true }
        shippedAt: { type: string, format: date-time, nullable: true }
        lines:
          type: array
          items: { $ref: '#/components/schemas/OrderLineDetail' }
    CreateProductRequest:
      type: object
      required: [title, categorySlug, variants]
      properties:
        title: { type: string }
        brandName: { type: string, nullable: true }
        description: { type: string, nullable: true }
        # A slug from GET /categories. The server refuses anything that isn't a live
        # system category, so a client cannot invent one by posting a name.
        categorySlug: { type: string }
        variants:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/CreateVariantRequest' }
    VariantOffer:
      type: object
      required: [id, productId, productSlug, productTitle, variantLabel, price, stockQty, sellerId]
      properties:
        id: { type: string }
        productId: { type: string, format: uuid }
        # What the drawer links back to.
        productSlug: { type: string }
        productTitle: { type: string }
        variantLabel: { type: string }
        thumbnailUrl: { type: string, nullable: true }
        price: { type: number }
        stockQty: { type: integer }
        # Lets the cart mark a line its viewer cannot buy because they are its
        # seller, instead of staying silent until the order is refused.
        sellerId: { type: string, format: uuid }
    ReviewSummary:
      type: object
      required: [averageRating, count]
      properties:
        averageRating: { type: number, nullable: true }
        count: { type: integer }
    ProductDetail:
      type: object
      required:
        [id, slug, sellerId, title, brandName, description, category, images, variants, reviewSummary]
      properties:
        id: { type: string, format: uuid }
        # The page is addressed by slug; the id is still what the cart, the reviews
        # and the images are keyed by internally.
        slug: { type: string }
        # For the own-product check on the buy box. sellerName is gone: it was in this
        # contract but never returned by the API, and nothing renders it - a field
        # that only exists in the spec is worse than an absent one.
        sellerId: { type: string, format: uuid }
        title: { type: string }
        brandName: { type: string, nullable: true }
        description: { type: string, nullable: true }
        category: { $ref: '#/components/schemas/Category' }
        images:
          type: array
          items: { $ref: '#/components/schemas/ProductImage' }
        variants:
          type: array
          items: { $ref: '#/components/schemas/ProductVariant' }
        reviewSummary:
          $ref: '#/components/schemas/ReviewSummary'
    Review:
      type: object
      required: [id, rating, createdAt]
      properties:
        id: { type: string, format: uuid }
        rating: { type: integer, minimum: 1, maximum: 5 }
        # A star rating on its own is a legitimate review.
        body: { type: string, nullable: true }
        variantLabel: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        # The buyer's own name. Null when their identity has only ever supplied an
        # email, which the UI shows as an anonymous reviewer rather than a blank.
        reviewerName: { type: string, nullable: true }
    CreateReviewRequest:
      type: object
      required: [orderLineId, rating]
      properties:
        # The purchase being reviewed. The server derives the product from it, so a
        # valid line cannot be used to review something else.
        orderLineId: { type: string, format: uuid }
        rating: { type: integer, minimum: 1, maximum: 5 }
        body: { type: string, nullable: true }
    ReviewEligibility:
      type: object
      required: [eligible]
      properties:
        eligible: { type: boolean }
        reason:
          type: string
          nullable: true
          enum: [NOT_PURCHASED, ALREADY_REVIEWED]
        # The purchase to submit against - present exactly when eligible is true.
        orderLineId: { type: string, format: uuid, nullable: true }
        existingReview:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/Review' }]
    BuyerSession:
      type: object
      required: [buyerIdentityId, email]
      properties:
        buyerIdentityId: { type: string, format: uuid }
        email: { type: string }
        fullName: { type: string, nullable: true }
    ReviewPage:
      type: object
      required: [content, page, totalElements, totalPages]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/Review' }
        page: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }
    ProblemDetail:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              reason: { type: string }

    # --- /api/v1 shapes -------------------------------------------------------

    # Supersedes the three-value status on the unversioned seller endpoints.
    # PACKED is the handover step the seller screens add; IN_TRANSIT and
    # OUT_FOR_DELIVERY are what the buyer's tracking timeline shows once a
    # carrier is scanning.
    OrderStatus:
      type: string
      enum: [PLACED, PACKED, SHIPPED, IN_TRANSIT, OUT_FOR_DELIVERY, DELIVERED, CANCELLED]
    ProductStatus:
      type: string
      enum: [ACTIVE, DRAFT, ARCHIVED]
    RefundStatus:
      type: string
      enum:
        [REQUESTED, APPROVED, AWAITING_RETURN, RETURN_RECEIVED, REFUNDED, REPLACEMENT_SENT, DECLINED, CANCELLED]
    RefundResolution:
      type: string
      enum: [REFUND, REPLACEMENT]
    # The design offers "the card you paid with" or "that card is closed, contact
    # me" - not store credit, which the marketplace has no concept of.
    RefundPayout:
      type: string
      enum: [ORIGINAL_PAYMENT, ALTERNATE_METHOD]

    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: number }
        currency: { type: string, minLength: 3, maxLength: 3 }

    # How the order was paid. Nothing stores this yet - checkout takes no
    # payment - so every screen treats it as optional and simply omits the row.
    PaymentSummary:
      type: object
      required: [brand, last4]
      properties:
        brand: { type: string }
        last4: { type: string, minLength: 4, maxLength: 4 }

    OrderTimelineEntry:
      type: object
      required: [code, label, completed]
      properties:
        code: { type: string, enum: [PLACED, PACKED, SHIPPED, IN_TRANSIT, OUT_FOR_DELIVERY, DELIVERED] }
        label: { type: string }
        at: { type: string, format: date-time, nullable: true }
        # True while `at` is a projection rather than something that happened.
        estimated: { type: boolean, default: false }
        completed: { type: boolean }
        detail: { type: string, nullable: true }

    ShipmentInfo:
      type: object
      properties:
        carrier: { type: string, nullable: true }
        trackingNumber: { type: string, nullable: true }
        trackingUrl: { type: string, nullable: true }
        estimatedDeliveryAt: { type: string, format: date-time, nullable: true }
        deliveredAt: { type: string, format: date-time, nullable: true }
        deliveryNote: { type: string, nullable: true }

    BuyerOrderLine:
      type: object
      required: [id, productRef, productTitle, variantLabel, quantity, unitPrice, lineTotal]
      properties:
        id: { type: string, format: uuid }
        productRef: { type: string }
        productTitle: { type: string }
        variantLabel: { type: string }
        thumbnailUrl: { type: string, nullable: true }
        quantity: { type: integer }
        unitPrice: { type: number }
        lineTotal: { type: number }
        # Set when this line is inside an open refund request.
        refundRequestId: { type: string, format: uuid, nullable: true }
        refundStatus:
          oneOf:
            - $ref: '#/components/schemas/RefundStatus'
          nullable: true

    StoreRef:
      type: object
      required: [name, handle]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        handle: { type: string }

    BuyerOrderSummary:
      type: object
      required: [id, reference, placedAt, status, total, currency, itemCount, seller]
      properties:
        id: { type: string, format: uuid }
        # Short human reference the screens print; the uuid stays the key.
        reference: { type: string }
        placedAt: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/OrderStatus' }
        total: { type: number }
        currency: { type: string }
        itemCount: { type: integer }
        seller: { $ref: '#/components/schemas/StoreRef' }
        previewLines:
          type: array
          items: { $ref: '#/components/schemas/BuyerOrderLine' }
        shipment: { $ref: '#/components/schemas/ShipmentInfo' }
        openRefundRequestId: { type: string, format: uuid, nullable: true }
    BuyerOrderSummaryPage:
      type: object
      required: [content, page, totalElements, totalPages]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/BuyerOrderSummary' }
        page: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }

    BuyerOrderDetail:
      type: object
      required:
        [id, reference, placedAt, status, seller, lines, subtotal, shipping, tax, total, currency, timeline, shippingAddress]
      properties:
        id: { type: string, format: uuid }
        reference: { type: string }
        placedAt: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/OrderStatus' }
        seller: { $ref: '#/components/schemas/StoreRef' }
        lines:
          type: array
          items: { $ref: '#/components/schemas/BuyerOrderLine' }
        subtotal: { type: number }
        shipping: { type: number }
        tax: { type: number }
        total: { type: number }
        currency: { type: string }
        timeline:
          type: array
          items: { $ref: '#/components/schemas/OrderTimelineEntry' }
        shipment: { $ref: '#/components/schemas/ShipmentInfo' }
        shippingAddress: { $ref: '#/components/schemas/Address' }
        billingAddress:
          oneOf:
            - $ref: '#/components/schemas/Address'
          nullable: true
        payment:
          oneOf:
            - $ref: '#/components/schemas/PaymentSummary'
          nullable: true
        refundRequests:
          type: array
          items: { $ref: '#/components/schemas/RefundRequestSummary' }
        # Server-owned, so no screen re-derives the return window from dates.
        canRequestRefund: { type: boolean }
        refundWindowEndsAt: { type: string, format: date-time, nullable: true }

    RefundRequestLine:
      type: object
      required: [orderLineId, productTitle, variantLabel, quantity, unitPrice, lineTotal]
      properties:
        orderLineId: { type: string, format: uuid }
        productTitle: { type: string }
        variantLabel: { type: string }
        quantity: { type: integer }
        unitPrice: { type: number }
        lineTotal: { type: number }
    RefundRequestSummary:
      type: object
      required: [id, reference, status, resolution, requestedAt, requestedAmount, currency]
      properties:
        id: { type: string, format: uuid }
        reference: { type: string }
        status: { $ref: '#/components/schemas/RefundStatus' }
        resolution: { $ref: '#/components/schemas/RefundResolution' }
        requestedAt: { type: string, format: date-time }
        requestedAmount: { type: number }
        approvedAmount: { type: number, nullable: true }
        currency: { type: string }
        orderId: { type: string, format: uuid }
        orderReference: { type: string }
        returnTrackingNumber: { type: string, nullable: true }
    RefundRequestDetail:
      type: object
      required:
        [id, reference, status, resolution, payout, detail, requestedAt, requestedAmount, currency, orderId, orderReference, lines]
      properties:
        id: { type: string, format: uuid }
        reference: { type: string }
        status: { $ref: '#/components/schemas/RefundStatus' }
        resolution: { $ref: '#/components/schemas/RefundResolution' }
        payout: { $ref: '#/components/schemas/RefundPayout' }
        detail: { type: string }
        requestedAt: { type: string, format: date-time }
        requestedAmount: { type: number }
        approvedAmount: { type: number, nullable: true }
        currency: { type: string }
        orderId: { type: string, format: uuid }
        orderReference: { type: string }
        orderPlacedAt: { type: string, format: date-time }
        buyerName: { type: string, nullable: true }
        buyerEmail: { type: string, nullable: true }
        seller: { $ref: '#/components/schemas/StoreRef' }
        paymentMethod: { type: string, nullable: true }
        lines:
          type: array
          items: { $ref: '#/components/schemas/RefundRequestLine' }
        approvedAt: { type: string, format: date-time, nullable: true }
        declinedAt: { type: string, format: date-time, nullable: true }
        declineReason: { type: string, nullable: true }
        returnReceivedAt: { type: string, format: date-time, nullable: true }
        refundedAt: { type: string, format: date-time, nullable: true }
        replacementSentAt: { type: string, format: date-time, nullable: true }
        returnTrackingNumber: { type: string, nullable: true }
    RefundRequestPage:
      type: object
      required: [content, page, totalElements, totalPages]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/RefundRequestSummary' }
        page: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }
    CreateRefundRequest:
      type: object
      required: [orderId, lines, resolution, detail]
      properties:
        orderId: { type: string, format: uuid }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [orderLineId, quantity]
            properties:
              orderLineId: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1 }
        resolution: { $ref: '#/components/schemas/RefundResolution' }
        # Required only when resolution is REFUND.
        payout:
          oneOf:
            - $ref: '#/components/schemas/RefundPayout'
          nullable: true
        detail: { type: string, minLength: 20 }
    UpdateRefundRequest:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/RefundStatus' }
        approvedAmount: { type: number }
        declineReason: { type: string }
        returnTrackingNumber: { type: string }
        note: { type: string }

    StoreStatus:
      type: string
      enum: [OPEN, VACATION, CLOSED]
    StoreProfile:
      type: object
      required: [id, name, handle, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        handle: { type: string }
        tagline: { type: string, nullable: true }
        location: { type: string, nullable: true }
        foundedYear: { type: integer, nullable: true }
        supportEmail: { type: string, nullable: true }
        about: { type: string, nullable: true }
        coverUrl: { type: string, nullable: true }
        logoUrl: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/StoreStatus' }
        vacationNote: { type: string, nullable: true }
        updatedAt: { type: string, format: date-time }
    UpdateStoreProfile:
      type: object
      properties:
        name: { type: string }
        handle: { type: string }
        tagline: { type: string }
        location: { type: string }
        foundedYear: { type: integer }
        supportEmail: { type: string }
        about: { type: string }
        coverUrl: { type: string, nullable: true }
        logoUrl: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/StoreStatus' }
        vacationNote: { type: string }
    PublicStore:
      type: object
      required: [id, name, handle, status, productCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        handle: { type: string }
        tagline: { type: string, nullable: true }
        location: { type: string, nullable: true }
        about: { type: string, nullable: true }
        coverUrl: { type: string, nullable: true }
        logoUrl: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/StoreStatus' }
        vacationNote: { type: string, nullable: true }
        productCount: { type: integer }
        inStockCount: { type: integer }
        averageRating: { type: number, nullable: true }
        ratingCount: { type: integer }

    SellerProductRow:
      type: object
      required: [id, productRef, title, category, status, variantCount, totalStock, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        productRef: { type: string }
        title: { type: string }
        brandName: { type: string, nullable: true }
        thumbnailUrl: { type: string, nullable: true }
        imageCount: { type: integer }
        category: { $ref: '#/components/schemas/Category' }
        status: { $ref: '#/components/schemas/ProductStatus' }
        variantCount: { type: integer }
        totalStock: { type: integer }
        priceFrom: { type: number }
        priceTo: { type: number }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SellerProductRowPage:
      type: object
      required: [content, page, totalElements, totalPages]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/SellerProductRow' }
        page: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }

    SellerOrderLine:
      type: object
      required: [id, productTitle, variantLabel, quantity, unitPrice, lineTotal]
      properties:
        id: { type: string, format: uuid }
        productRef: { type: string, nullable: true }
        productTitle: { type: string }
        variantLabel: { type: string }
        sku: { type: string, nullable: true }
        quantity: { type: integer }
        unitPrice: { type: number }
        lineTotal: { type: number }
    SellerOrderRow:
      type: object
      required: [id, reference, buyerEmail, recipientName, placedAt, status, itemCount, total, currency]
      properties:
        id: { type: string, format: uuid }
        reference: { type: string }
        buyerEmail: { type: string }
        recipientName: { type: string }
        placedAt: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/OrderStatus' }
        itemCount: { type: integer }
        total: { type: number }
        currency: { type: string }
        destination: { type: string, nullable: true }
        trackingNumber: { type: string, nullable: true }
        hasOpenRefund: { type: boolean }
    SellerOrderRowPage:
      type: object
      required: [content, page, totalElements, totalPages]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/SellerOrderRow' }
        page: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }
    SellerOrderRowDetail:
      type: object
      required:
        [id, reference, buyerEmail, recipientName, placedAt, status, lines, subtotal, shipping, total, currency, shippingAddress]
      properties:
        id: { type: string, format: uuid }
        reference: { type: string }
        buyerEmail: { type: string }
        recipientName: { type: string }
        placedAt: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/OrderStatus' }
        lines:
          type: array
          items: { $ref: '#/components/schemas/SellerOrderLine' }
        subtotal: { type: number }
        shipping: { type: number }
        tax: { type: number }
        total: { type: number }
        currency: { type: string }
        shippingAddress: { $ref: '#/components/schemas/Address' }
        shipment: { $ref: '#/components/schemas/ShipmentInfo' }
        packedAt: { type: string, format: date-time, nullable: true }
        parcels: { type: integer, nullable: true }
        refundRequests:
          type: array
          items: { $ref: '#/components/schemas/RefundRequestSummary' }
    HandoverMethod:
      type: string
      enum: [AMEZO_PICKUP, HUB_DROPOFF, LOCKER_DROP]
    UpdateSellerOrder:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/OrderStatus' }
        # PLACED -> PACKED
        parcels: { type: integer, minimum: 1 }
        packedBy: { type: string }
        # PACKED -> SHIPPED. The tracking number is issued by the platform on
        # handover, not typed by the seller, so it is not writable here.
        handoverMethod: { $ref: '#/components/schemas/HandoverMethod' }
        hub: { type: string }
        # Shown to the buyer on the order's timeline.
        note: { type: string }

    MetricPoint:
      type: object
      required: [date, views, orders, revenue]
      properties:
        date: { type: string, format: date }
        views: { type: integer }
        orders: { type: integer }
        revenue: { type: number }
    MetricTotals:
      type: object
      required: [views, orders, revenue, conversionRate, averageOrderValue]
      properties:
        views: { type: integer }
        orders: { type: integer }
        revenue: { type: number }
        conversionRate: { type: number }
        averageOrderValue: { type: number }
    SellerMetrics:
      type: object
      required: [from, to, currency, totals, series]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        currency: { type: string }
        totals: { $ref: '#/components/schemas/MetricTotals' }
        # The immediately preceding window of equal length, for the deltas.
        previousTotals:
          oneOf:
            - $ref: '#/components/schemas/MetricTotals'
          nullable: true
        series:
          type: array
          items: { $ref: '#/components/schemas/MetricPoint' }
    TopProduct:
      type: object
      required: [productId, productRef, title, units, revenue, share]
      properties:
        productId: { type: string, format: uuid }
        productRef: { type: string }
        title: { type: string }
        thumbnailUrl: { type: string, nullable: true }
        units: { type: integer }
        revenue: { type: number }
        share: { type: number }
    CategoryShare:
      type: object
      required: [category, revenue, units, share]
      properties:
        category: { $ref: '#/components/schemas/Category' }
        revenue: { type: number }
        units: { type: integer }
        share: { type: number }
