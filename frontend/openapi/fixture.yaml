openapi: 3.1.0
info:
  title: Amezo API (fixture)
  version: 0.0.0
  description: >
    Placeholder spec so the codegen pipeline (springdoc -> OpenAPI ->
    openapi-typescript) has something to run against before the Spring
    backend exposes its own. Modeled on docs/api-design.md's documented
    GET /products contract, not the backend's current partial
    implementation (q-only as of this writing — see ProductController.java).
    Swap `gen:api` in package.json to point at the live springdoc endpoint
    once the backend catches up to this contract; this file goes away then.
paths:
  /products:
    get:
      operationId: searchProducts
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
        - name: priceMin
          in: query
          schema: { type: number }
        - name: priceMax
          in: query
          schema: { type: number }
        - name: inStockOnly
          in: query
          schema: { type: boolean }
        - name: sort
          in: query
          schema:
            type: string
            enum: [relevance, price_asc, price_desc, newest]
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 16 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductSummaryPage'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /products/{productId}:
    get:
      operationId: getProduct
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    delete:
      operationId: sellerDeleteProduct
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: No Content
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /products/{productId}/reviews:
    get:
      operationId: getProductReviews
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 10 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewPage'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /auth/seller/magic-link:
    post:
      operationId: sellerRequestMagicLink
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '204':
          description: No Content
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /auth/seller/verify:
    post:
      operationId: sellerVerify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerSession'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /auth/seller/session:
    delete:
      operationId: sellerSignOut
      responses:
        '204':
          description: No Content
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /sellers/me/products:
    get:
      operationId: sellerListProducts
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerProductSummaryPage'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    post:
      operationId: sellerCreateProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: string, format: uuid }
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /products/{productId}/images/upload-url:
    post:
      operationId: sellerCreateImageUploadUrl
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentType, position]
              properties:
                contentType: { type: string }
                fileSizeBytes: { type: integer }
                position: { type: integer }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [id, status, uploadUrl, expiresAt]
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string }
                  uploadUrl: { type: string }
                  expiresAt: { type: string, format: date-time }
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /products/{productId}/images/confirm:
    post:
      operationId: sellerConfirmImage
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [imageId]
              properties:
                imageId: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductImage'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  # Proposed contract only - no backend implementation exists yet (added for the cart drawer's batch fetch).
  /variants:
    get:
      operationId: getVariantsByIds
      parameters:
        - name: ids
          in: query
          required: true
          schema: { type: string }
          description: Comma-separated variant ids. Ids that don't exist are simply omitted from the response.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/VariantOffer' }
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
components:
  schemas:
    ProductSummary:
      type: object
      required: [id, title, brandName, category, priceFrom, inStock]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        brandName: { type: string }
        category: { type: string }
        priceFrom: { type: number }
        thumbnailUrl: { type: string, nullable: true }
        avgRating: { type: number, nullable: true }
        inStock: { type: boolean }
    ProductSummaryPage:
      type: object
      required: [content, page, totalElements, totalPages]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/ProductSummary' }
        page: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }
    ProductImage:
      type: object
      required: [id, url, position]
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        position: { type: integer }
    ProductVariant:
      type: object
      required: [id, label, sku, price, stockQty]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        sku: { type: string }
        price: { type: number }
        stockQty: { type: integer }
    SellerSession:
      type: object
      required: [sellerId, email]
      properties:
        sellerId: { type: string, format: uuid }
        email: { type: string }
    SellerProductSummary:
      type: object
      required: [id, title, category, variantCount, createdAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        thumbnailUrl: { type: string, nullable: true }
        category: { type: string }
        variantCount: { type: integer }
        createdAt: { type: string, format: date-time }
    SellerProductSummaryPage:
      type: object
      required: [content, page, totalElements, totalPages]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/SellerProductSummary' }
        page: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }
    CreateVariantRequest:
      type: object
      required: [label, sku, price, stockQty]
      properties:
        label: { type: string }
        sku: { type: string }
        price: { type: number }
        stockQty: { type: integer }
    CreateProductRequest:
      type: object
      required: [title, category, variants]
      properties:
        title: { type: string }
        brandName: { type: string, nullable: true }
        description: { type: string, nullable: true }
        category: { type: string }
        variants:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/CreateVariantRequest' }
    VariantOffer:
      type: object
      required: [id, productId, productTitle, variantLabel, price, stockQty]
      properties:
        id: { type: string }
        productId: { type: string, format: uuid }
        productTitle: { type: string }
        variantLabel: { type: string }
        thumbnailUrl: { type: string, nullable: true }
        price: { type: number }
        stockQty: { type: integer }
    ReviewSummary:
      type: object
      required: [averageRating, count]
      properties:
        averageRating: { type: number, nullable: true }
        count: { type: integer }
    ProductDetail:
      type: object
      required:
        [id, title, brandName, description, category, sellerId, sellerName, images, variants, reviewSummary]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        brandName: { type: string }
        description: { type: string }
        category: { type: string }
        sellerId: { type: string, format: uuid }
        sellerName: { type: string }
        images:
          type: array
          items: { $ref: '#/components/schemas/ProductImage' }
        variants:
          type: array
          items: { $ref: '#/components/schemas/ProductVariant' }
        reviewSummary:
          $ref: '#/components/schemas/ReviewSummary'
    Review:
      type: object
      required: [id, rating, body, variantLabel, createdAt, reviewerFirstName]
      properties:
        id: { type: string, format: uuid }
        rating: { type: integer }
        body: { type: string }
        variantLabel: { type: string }
        createdAt: { type: string, format: date-time }
        reviewerFirstName: { type: string }
    ReviewPage:
      type: object
      required: [content, page, totalElements, totalPages]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/Review' }
        page: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }
    ProblemDetail:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              reason: { type: string }
